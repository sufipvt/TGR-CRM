<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a56db">
  <title>No connection</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f6fb; color: #111827; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: #6b7280; margin: 0 0 20px; }
    button { background: #1a56db; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 16px; }
  </style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your signal or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
